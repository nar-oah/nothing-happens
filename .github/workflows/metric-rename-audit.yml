name: Metric rename audit

on:
  push:
    branches:
      - refactor/rename-economic-metrics

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find legacy metric names
        run: |
          set -euo pipefail
          git grep -n -i -E 'price|wage|trade|物价|物價|工钱|工錢|商贸|商貿|用工' -- . ':!*.tres' ':!.github/workflows/metric-rename-audit.yml' || true
