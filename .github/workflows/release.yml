name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_TEMPLATE_VERSION: 4.7.1.stable
  GODOT_CEF_VERSION: v1.15.3
  GODOT_DIR: godot
  WEB_DIR: frontend

jobs:
  export-desktop:
    name: Export Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.WEB_DIR }}/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build Svelte frontend for Godot
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm build:godot

      - name: Install Godot CEF
        run: |
          set -euo pipefail

          CEF_ZIP="/tmp/godot_cef-${GODOT_CEF_VERSION}.zip"
          CEF_TMP="/tmp/godot-cef"

          curl --fail --location --retry 3 \
            "https://github.com/dsh0416/godot-cef/releases/download/${GODOT_CEF_VERSION}/godot_cef-${GODOT_CEF_VERSION}.zip" \
            --output "$CEF_ZIP"

          rm -rf "$CEF_TMP" "$GODOT_DIR/addons/godot_cef"
          mkdir -p "$CEF_TMP" "$GODOT_DIR/addons"
          unzip -q "$CEF_ZIP" -d "$CEF_TMP"

          test -d "$CEF_TMP/dist/addons/godot_cef"
          mv "$CEF_TMP/dist/addons/godot_cef" "$GODOT_DIR/addons/godot_cef"

          test -f "$GODOT_DIR/addons/godot_cef/godot_cef.gdextension"

          rm -rf "$CEF_TMP" "$CEF_ZIP"
          du -sh "$GODOT_DIR/addons/godot_cef"

      - name: Export Windows and Linux
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./godot
          presets_to_export: Windows Desktop,Linux
          archive_output: true
          archive_root_folder: true
          cache: true
          verbose: true

      - name: Upload Windows and Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error

  export-macos:
    name: Export macOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.WEB_DIR }}/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build Svelte frontend for Godot
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm build:godot

      - name: Install Godot CEF
        run: |
          set -euo pipefail

          CEF_ZIP="$RUNNER_TEMP/godot_cef-${GODOT_CEF_VERSION}.zip"
          CEF_TMP="$RUNNER_TEMP/godot-cef"

          curl --fail --location --retry 3 \
            "https://github.com/dsh0416/godot-cef/releases/download/${GODOT_CEF_VERSION}/godot_cef-${GODOT_CEF_VERSION}.zip" \
            --output "$CEF_ZIP"

          rm -rf "$CEF_TMP" "$GODOT_DIR/addons/godot_cef"
          mkdir -p "$CEF_TMP" "$GODOT_DIR/addons"
          unzip -q "$CEF_ZIP" -d "$CEF_TMP"

          test -d "$CEF_TMP/dist/addons/godot_cef"
          mv "$CEF_TMP/dist/addons/godot_cef" "$GODOT_DIR/addons/godot_cef"

          test -f "$GODOT_DIR/addons/godot_cef/godot_cef.gdextension"

          rm -rf "$CEF_TMP" "$CEF_ZIP"
          du -sh "$GODOT_DIR/addons/godot_cef"

      - name: Patch Godot CEF for macOS
        run: python3 scripts/patch_godot_cef_macos.py

      - name: Install Godot and export templates
        run: |
          set -euo pipefail

          GODOT_ZIP="$RUNNER_TEMP/godot-macos.zip"
          GODOT_TMP="$RUNNER_TEMP/godot-macos"
          TEMPLATE_ARCHIVE="$RUNNER_TEMP/godot-export-templates.tpz"
          TEMPLATE_TMP="$RUNNER_TEMP/godot-export-templates"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_VERSION}"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
            --output "$GODOT_ZIP"

          rm -rf "$GODOT_TMP"
          mkdir -p "$GODOT_TMP"
          ditto -x -k "$GODOT_ZIP" "$GODOT_TMP"

          GODOT_BIN="$GODOT_TMP/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT_BIN"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            --output "$TEMPLATE_ARCHIVE"

          rm -rf "$TEMPLATE_TMP" "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_TMP" "$TEMPLATE_DIR"
          unzip -q "$TEMPLATE_ARCHIVE" -d "$TEMPLATE_TMP"

          test -d "$TEMPLATE_TMP/templates"
          cp -R "$TEMPLATE_TMP/templates/." "$TEMPLATE_DIR/"

          "$GODOT_BIN" --version

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Export macOS
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$GODOT_DIR" \
            --export-release "macOS" \
            "$RUNNER_TEMP/nothing-happens-macos-unsigned.zip"

          test -f "$RUNNER_TEMP/nothing-happens-macos-unsigned.zip"

      - name: Post-process and sign macOS export
        run: |
          set -euo pipefail

          python3 scripts/postprocess_macos_export.py \
            "$RUNNER_TEMP/nothing-happens-macos-unsigned.zip" \
            "$RUNNER_TEMP/nothing-happens-macos.zip"

          test -f "$RUNNER_TEMP/nothing-happens-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ runner.temp }}/nothing-happens-macos.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - export-desktop
      - export-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Show release artifacts
        run: |
          set -euo pipefail
          find release-artifacts -maxdepth 2 -type f -print

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: release-artifacts/*
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          immutableCreate: true
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
