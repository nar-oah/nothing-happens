name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_CEF_VERSION: v1.15.3
  GODOT_DIR: godot
  WEB_DIR: frontend

jobs:
  export:
    name: Build, export and release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.WEB_DIR }}/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build Svelte frontend for Godot
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm build:godot

      - name: Install Godot CEF
        run: |
          set -euo pipefail

          CEF_ZIP="/tmp/godot_cef-${GODOT_CEF_VERSION}.zip"
          CEF_TMP="/tmp/godot-cef"

          curl --fail --location --retry 3 \
            "https://github.com/dsh0416/godot-cef/releases/download/${GODOT_CEF_VERSION}/godot_cef-${GODOT_CEF_VERSION}.zip" \
            --output "$CEF_ZIP"

          rm -rf "$CEF_TMP" "$GODOT_DIR/addons/godot_cef"
          mkdir -p "$CEF_TMP" "$GODOT_DIR/addons"
          unzip -q "$CEF_ZIP" -d "$CEF_TMP"

          test -d "$CEF_TMP/dist/addons/godot_cef"
          mv "$CEF_TMP/dist/addons/godot_cef" "$GODOT_DIR/addons/godot_cef"

          test -f "$GODOT_DIR/addons/godot_cef/godot_cef.gdextension"

          rm -rf "$CEF_TMP" "$CEF_ZIP"
          du -sh "$GODOT_DIR/addons/godot_cef"

      - name: Export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./godot
          archive_output: true
          archive_root_folder: true
          cache: true
          verbose: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          immutableCreate: true
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
